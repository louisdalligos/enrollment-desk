[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enrollment-desk"
version = "0.1.0"
description = "HMO enrollment and endorsement desk: validated, traceable enrollments with AI assistance (portfolio project, synthetic data)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Louis Dalligos", email = "louisdalligos@outlook.com" }]
dependencies = ["pydantic>=2.6,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
enrollment-desk = "enrollment_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
