[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enrollment-desk"
version = "0.1.0"
description = "HMO enrollment and endorsement desk: validated, traceable enrollments with AI assistance"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Louis Dalligos", email = "louisdalligos@outlook.com" }]
dependencies = ["pydantic>=2.6,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
aws = ["boto3>=1.36"]
dev = ["pytest>=8", "boto3>=1.36"]

[project.scripts]
enrollment-desk = "enrollment_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
enrollment_desk = ["web.html", "web.js", "auth.js"]
