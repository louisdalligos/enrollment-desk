name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[aws,dev]"
      - name: Unit and workflow tests
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser authentication tests
        run: node --test tests/auth.test.mjs tests/web.test.mjs
      - name: Build Linux Lambda package
        run: python scripts/build_lambda.py
      - name: Evaluation gate (parser + rules vs labeled requests)
        run: enrollment-desk evaluate data/generated

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - name: Validate (needs the package file to exist)
        run: |
          mkdir -p ../../build && touch ../../build/lambda.zip
          terraform validate
      - name: Mocked workflow-only and web-enabled plans
        run: terraform test -no-color
